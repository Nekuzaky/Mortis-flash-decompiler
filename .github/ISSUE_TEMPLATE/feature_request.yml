name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or the file type that MortisFlash does not handle well today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today, if any.
